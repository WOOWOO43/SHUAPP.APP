name: Scrape 247sports Offers

on:
  schedule:
    - cron: '0 13 * * *'   # 6am PST daily
  workflow_dispatch:        # lets you trigger manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install packages
        run: |
          install.packages(c("httr", "rvest", "dplyr", "stringr"))
        shell: Rscript {0}

      - name: Run scrape
        run: Rscript scrape_job.R

      - name: Commit updated cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ca_offers_cache.csv ca_offers_cache_timestamp.txt
          git diff --staged --quiet || git commit -m "Auto-update offers cache $(date -u)"
          git push